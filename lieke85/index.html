<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lieke — 85 jaor</title>
  <meta name="description" content="Een reis door de tijd, voor Lieke's 85e verjaardag.">
  <meta name="theme-color" content="#f2f1ec">

  <!-- Fonts: Cormorant Garamond (display & captions) + Karla (labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Floating badge that shows which era you are scrolling through -->
  <div class="era-badge" id="eraBadge" aria-hidden="true">
    <span id="eraBadgeText">1941</span>
  </div>

  <!-- ============ HERO ============ -->
  <header class="hero">
    <div class="motes" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <p class="hero-eyebrow reveal">8 augustus 2026</p>

    <h1 class="hero-name reveal">Lieke</h1>

    <div class="hero-number reveal" aria-hidden="true">
      <span class="rule"></span>
      <span class="num">85</span>
      <span class="rule"></span>
    </div>

    <p class="hero-sub reveal">
      Viefentachtig jaor, verteld in 37 fotos.<br>
      Gaank röstig door de tied&nbsp;&hellip;
    </p>

    <div class="scroll-hint reveal" aria-hidden="true">
      <span class="chevron"></span>
    </div>
  </header>

  <!-- ============ TIMELINE ============ -->
  <main class="timeline" id="timeline">
    <!-- The golden thread of time: fills with gold as you scroll -->
    <div class="thread" aria-hidden="true">
      <div class="thread-fill" id="threadFill"></div>
    </div>

    <!-- Photos and era markers are generated by script.js -->
    <div class="entries" id="entries"></div>
  </main>

  <!-- ============ OUTRO ============ -->
  <footer class="outro">
    <div class="motes" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <p class="outro-eyebrow reveal">en ut verhaol geit weijer</p>
    <h2 class="outro-title reveal">Perfisiat,<br>leeve Lieke</h2>
    <p class="outro-text reveal">
      Viefentachtig jaor vol leefde en gezèlligheid.<br>
      En um dat te viere, doen veer saame get leuks!<br>
      Veer hawwe vaan diech. &hearts;
    </p>
    <p class="outro-sign reveal">&mdash; Didier (en Daantje)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
